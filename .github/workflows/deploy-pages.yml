name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Gives the GITHUB_TOKEN write access to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deploy at a time and cancel in-progress deploys.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Stage app + Storybook for Pages
        run: |
          # The app deploys to the site root; Storybook goes under /storybook/.
          mkdir -p _site/storybook
          cp -r dist/. _site/
          cp -r storybook-static/. _site/storybook/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
